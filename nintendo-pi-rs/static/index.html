<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nintendo Pi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #2d2d2d; --surface: #3a3a3a; --card: #444;
    --accent: #e60012; --accent-hover: #c7000f;
    --text: #f0f0f0; --muted: #999;
    --green: #49b84f; --red: #e60012; --yellow: #f5c518; --blue: #4a9bd9;
    --joycon-blue: #00c3e3; --joycon-red: #ff3c28;
    --rail-width: 4px;
    --radius: 16px; --radius-sm: 12px;
  }
  html { font-size: 16px; }
  body {
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
    padding: 0 var(--rail-width) 2rem;
    padding: 0 var(--rail-width) calc(2rem + env(safe-area-inset-bottom, 0px));
    -webkit-tap-highlight-color: transparent;
  }
  .content-wrap {
    max-width: 900px; margin: 0 auto;
  }
  /* Subtle diamond crosshatch pattern nod to SNES controller grip */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; opacity: 0.025;
    background-image:
      linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%),
      linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
  }
  /* Joy-Con rail accents — neon blue left, neon red right */
  body::after {
    content: ''; position: fixed; inset: 0; z-index: 50; pointer-events: none;
    border-left: var(--rail-width) solid var(--joycon-blue);
    border-right: var(--rail-width) solid var(--joycon-red);
  }
  .status-bar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.7rem 1rem; background: linear-gradient(180deg, #282828 0%, #1e1e1e 100%);
    border-bottom: 3px solid transparent;
    border-image: linear-gradient(to right, var(--joycon-blue), var(--accent) 50%, var(--joycon-red)) 1;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .status-bar h1 {
    font-size: 1.05rem; font-weight: 800; letter-spacing: 0.03em;
    color: var(--text);
  }
  .status-pills { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
  .status-pill {
    display: flex; align-items: center; gap: 0.3rem;
    font-size: 0.7rem; font-weight: 700; color: var(--muted); padding: 0.2rem 0.55rem;
    background: rgba(255,255,255,0.07); border-radius: 20px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block; transition: background 0.3s, box-shadow 0.3s;
  }
  .status-dot.green { background: var(--green); box-shadow: 0 0 8px rgba(73,184,79,0.6); }
  .status-dot.red { background: var(--red); }
  .status-dot.yellow { background: var(--yellow); box-shadow: 0 0 8px rgba(245,197,24,0.5); }
  .section {
    margin: 0.6rem 0.75rem; padding: 1rem;
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.06);
    border-left: 2px solid rgba(0,195,227,0.2);
    border-right: 2px solid rgba(255,60,40,0.2);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .section-title {
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); margin-bottom: 0.7rem; font-weight: 800;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .section-title::before {
    content: ''; display: inline-block; width: 3px; height: 0.9em;
    background: var(--accent); border-radius: 2px;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: var(--radius-sm); cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem; font-weight: 700; color: #fff;
    padding: 0.7rem 1.2rem; min-height: 46px;
    transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    -webkit-user-select: none; user-select: none;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
    position: relative;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0,0,0,0.25); }
  .btn:disabled { opacity: 0.35; pointer-events: none; }
  .btn-accent { background: var(--accent); }
  .btn-green { background: var(--green); }
  .btn-blue { background: var(--blue); }
  .btn-yellow { background: var(--yellow); color: #222; }
  .btn-dark { background: rgba(255,255,255,0.1); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  .btn-red { background: var(--red); }
  .toggle-row { display: flex; align-items: center; gap: 1rem; }
  .toggle-row .label { flex: 1; font-size: 1.05rem; font-weight: 700; }
  .toggle-status {
    font-size: 0.8rem; padding: 0.3rem 0.9rem; border-radius: 20px; font-weight: 800;
    letter-spacing: 0.03em;
  }
  .toggle-status.on { background: var(--green); color: #fff; }
  .toggle-status.off { background: rgba(255,255,255,0.1); color: var(--muted); }
  /* Home-button style toggle */
  .btn-home {
    width: 52px; height: 52px; border-radius: 50%; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: #333; border: 2px solid rgba(255,255,255,0.1);
    box-shadow: 0 3px 0 rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.06);
    min-height: unset;
  }
  .btn-home:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0,0,0,0.3); }
  .slot-nav {
    display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem;
  }
  .slot-nav .btn { flex: 0 0 auto; padding: 0.8rem; font-size: 1.3rem; border-radius: 50%; width: 46px; height: 46px; }
  /* D-pad style nav buttons */
  .dpad-btn {
    width: 50px; height: 50px; border-radius: 4px; font-size: 1.1rem;
    background: #333; border: 2px solid rgba(255,255,255,0.08);
    box-shadow: 0 3px 0 rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    position: relative;
  }
  .dpad-btn::after {
    content: ''; position: absolute; inset: 6px; border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .dpad-btn:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0,0,0,0.35); }
  .slot-info { flex: 1; text-align: center; min-width: 0; }
  .slot-num { font-size: 1.6rem; font-weight: 900; letter-spacing: -0.02em; }
  .slot-name {
    font-size: 0.85rem; color: var(--muted); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Power LED indicator */
  .power-led {
    width: 6px; height: 6px; border-radius: 50%; display: inline-block;
    background: var(--green); box-shadow: 0 0 6px rgba(73,184,79,0.7);
    margin-right: 0.5rem; vertical-align: middle;
    animation: led-breathe 3s ease-in-out infinite;
  }
  @keyframes led-breathe {
    0%, 100% { opacity: 0.7; box-shadow: 0 0 4px rgba(73,184,79,0.5); }
    50% { opacity: 1; box-shadow: 0 0 10px rgba(73,184,79,0.9); }
  }
  .speed-row { display: flex; gap: 0.4rem; margin-top: 0.6rem; }
  .speed-row .btn {
    flex: 1; padding: 0.5rem 0.3rem; font-size: 0.78rem; min-height: 38px;
    border-radius: 20px; font-weight: 800;
  }
  .speed-row .btn.active { background: var(--blue); box-shadow: 0 3px 0 rgba(0,0,0,0.25); }
  /* Face-button style circular action buttons */
  .btn-face {
    width: 62px; height: 62px; border-radius: 50%; padding: 0;
    font-size: 0.85rem; font-weight: 900; letter-spacing: 0.04em;
    border: 2.5px solid rgba(255,255,255,0.12);
    box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 0 0 3px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.15);
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    min-height: unset;
  }
  .btn-face:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 rgba(0,0,0,0.3), 0 0 0 3px rgba(0,0,0,0.15), inset 0 2px 3px rgba(0,0,0,0.3);
  }
  .playback-controls {
    display: flex; align-items: center; justify-content: center;
    gap: 0.8rem; margin-bottom: 0.6rem; padding: 0.4rem 0;
  }
  .playback-controls .btn-face { flex: 0 0 auto; }
  /* Plus/Minus shaped speed buttons */
  .speed-row .btn.pm-btn {
    position: relative; min-width: 42px;
  }
  .rec-status {
    display: inline-block; padding: 0.25rem 0.6rem; border-radius: 20px;
    font-size: 0.75rem; font-weight: 800; margin-left: 0.5rem;
    letter-spacing: 0.08em;
  }
  .rec-status.active { background: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .progress-bar-outer {
    width: 100%; height: 6px; background: rgba(255,255,255,0.08);
    border-radius: 3px; overflow: hidden; margin-bottom: 0.3rem;
  }
  .progress-bar-inner {
    height: 100%; border-radius: 3px;
    background: linear-gradient(to right, var(--joycon-blue), var(--accent), var(--joycon-red));
    transition: width 0.15s linear; width: 0%;
  }
  .progress-label { font-size: 0.7rem; color: var(--muted); font-weight: 700; text-align: center; }
  /* Switch Home Screen macro tiles */
  .macro-list-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 0.6rem; padding: 0.2rem 0;
  }
  .macro-tile {
    position: relative; border-radius: var(--radius-sm);
    background: var(--card); overflow: hidden; cursor: pointer;
    transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.18s ease, border-color 0.18s ease;
    border: 2px solid rgba(255,255,255,0.06);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    -webkit-user-select: none; user-select: none;
  }
  .macro-tile:active { transform: scale(0.96); }
  .macro-tile.selected {
    border-color: var(--joycon-blue);
    box-shadow: 0 0 0 2px rgba(0,195,227,0.35), 0 4px 16px rgba(0,195,227,0.15);
  }
  /* Color accent strip at top of each tile — cycles through face button colors */
  .macro-tile-accent {
    height: 4px; width: 100%;
  }
  .macro-tile-accent.color-0 { background: var(--green); }
  .macro-tile-accent.color-1 { background: var(--red); }
  .macro-tile-accent.color-2 { background: var(--blue); }
  .macro-tile-accent.color-3 { background: var(--yellow); }
  .macro-tile-body {
    padding: 0.65rem 0.6rem 0.5rem;
  }
  .macro-tile-slot {
    font-size: 0.6rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.2rem;
  }
  .macro-tile-name {
    font-size: 0.85rem; font-weight: 700; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 0.35rem;
  }
  .macro-tile-meta {
    font-size: 0.68rem; color: var(--muted); font-weight: 600;
    display: flex; gap: 0.4rem; align-items: center;
  }
  .macro-tile-meta span { white-space: nowrap; }
  .macro-tile-actions {
    display: flex; border-top: 1px solid rgba(255,255,255,0.06);
  }
  .macro-tile-actions .tile-btn {
    flex: 1; padding: 0.45rem 0; border: none; cursor: pointer;
    font-family: 'Nunito', sans-serif; font-size: 0.7rem; font-weight: 700;
    background: transparent; color: var(--muted);
    transition: background 0.15s, color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .macro-tile-actions .tile-btn:first-child {
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  .macro-tile-actions .tile-btn:active { background: rgba(255,255,255,0.08); }
  .macro-tile-actions .tile-btn.tile-btn-del { color: var(--red); }
  .macro-tile-actions .tile-btn.tile-btn-del:active { background: rgba(230,0,18,0.12); }
  .empty-msg {
    color: var(--muted); font-size: 0.9rem; font-weight: 600;
    text-align: center; padding: 2rem 1rem;
  }
  .empty-icon {
    display: block; font-size: 2.2rem; margin-bottom: 0.5rem;
    opacity: 0.35; filter: grayscale(0.5);
  }
  .empty-hint {
    font-size: 0.75rem; margin-top: 0.3rem; color: rgba(255,255,255,0.25);
  }
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7); align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface); border-radius: var(--radius);
    padding: 1.5rem; width: 90%; max-width: 340px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .modal h3 { margin-bottom: 1rem; font-size: 1.1rem; font-weight: 800; }
  .modal input {
    width: 100%; padding: 0.7rem; border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,0.15); background: var(--bg);
    color: var(--text); font-size: 1rem; font-family: 'Nunito', sans-serif;
    font-weight: 600; margin-bottom: 1rem;
  }
  .modal input:focus { outline: none; border-color: var(--accent); }
  .modal-btns { display: flex; gap: 0.5rem; }
  .modal-btns .btn { flex: 1; }

  /* === Controller visualization === */
  .controller-section {
    margin: 0.6rem 0.75rem; padding: 0.8rem 0.5rem 0.6rem;
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.06);
    border-left: 2px solid rgba(0,195,227,0.2);
    border-right: 2px solid rgba(255,60,40,0.2);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    text-align: center;
    animation: section-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .controller-svg-wrap {
    display: inline-block; max-width: 320px; width: 100%;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    transition: filter 0.3s ease;
  }
  .controller-svg-wrap.disconnected { filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3)) saturate(0.2) brightness(0.6); }
  .controller-svg-wrap.recording { animation: ctrl-rec-pulse 1.2s ease-in-out infinite; }
  @keyframes ctrl-rec-pulse {
    0%, 100% { filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4)); }
    50% { filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4)) drop-shadow(0 0 16px rgba(230,0,18,0.5)); }
  }
  /* Controller SVG element styles */
  .ctrl-body { fill: #333; stroke: #555; stroke-width: 1.5; }
  .ctrl-grip-l { fill: #0ab9d6; }
  .ctrl-grip-r { fill: #ff4554; }
  .ctrl-grip-l, .ctrl-grip-r { opacity: 0.85; transition: opacity 0.3s; }
  .disconnected .ctrl-grip-l, .disconnected .ctrl-grip-r { opacity: 0.3; }
  .ctrl-stick-base { fill: #222; stroke: #444; stroke-width: 1; }
  .ctrl-stick-cap { fill: #2a2a2a; stroke: #555; stroke-width: 0.8; transition: fill 0.1s, cx 0.1s, cy 0.1s; }
  .ctrl-stick-cap.active { fill: #49b84f; }
  .ctrl-btn { fill: #222; stroke: rgba(255,255,255,0.15); stroke-width: 0.8; transition: fill 0.1s; }
  .ctrl-btn.active-a { fill: var(--green); }
  .ctrl-btn.active-b { fill: var(--red); }
  .ctrl-btn.active-x { fill: var(--blue); }
  .ctrl-btn.active-y { fill: var(--yellow); }
  .ctrl-btn-label { fill: rgba(255,255,255,0.5); font-size: 6px; font-weight: 800; font-family: 'Nunito', sans-serif; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
  .ctrl-btn.active-a .ctrl-btn-label, .ctrl-btn.active-b .ctrl-btn-label,
  .ctrl-btn.active-x .ctrl-btn-label { fill: #fff; }
  .ctrl-btn.active-y .ctrl-btn-label { fill: #222; }
  .ctrl-dpad { fill: #222; stroke: rgba(255,255,255,0.1); stroke-width: 0.8; }
  .ctrl-dpad-btn { fill: transparent; transition: fill 0.1s; }
  .ctrl-dpad-btn.active { fill: rgba(255,255,255,0.25); }
  .ctrl-bumper { fill: #2a2a2a; stroke: #444; stroke-width: 0.8; rx: 3; transition: fill 0.1s; }
  .ctrl-bumper.active { fill: #666; }
  .ctrl-trigger { fill: #252525; stroke: #444; stroke-width: 0.8; rx: 2; transition: fill 0.1s; }
  .ctrl-trigger.active { fill: #666; }
  .ctrl-special { fill: #2a2a2a; stroke: rgba(255,255,255,0.1); stroke-width: 0.6; transition: fill 0.1s; }
  .ctrl-special.active { fill: #666; }
  .ctrl-home { fill: #333; stroke: rgba(255,255,255,0.15); stroke-width: 0.8; }
  .ctrl-capture { fill: #333; stroke: rgba(255,255,255,0.15); stroke-width: 0.8; }
  .ctrl-status-text {
    font-size: 0.7rem; color: var(--muted); font-weight: 700; margin-top: 0.4rem;
    letter-spacing: 0.05em;
  }
  .ctrl-status-text.recording { color: var(--red); }
  .ctrl-status-text.playing { color: var(--green); }
  .ctrl-playback-progress {
    max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease, margin 0.3s ease;
    margin-top: 0;
  }
  .ctrl-playback-progress.show {
    max-height: 60px; opacity: 1; margin-top: 0.5rem;
  }

  /* === Switch-style entrance animations === */
  @keyframes section-in {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .section, .status-bar {
    animation: section-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .status-bar { animation-delay: 0s; }
  .grid-area .section:nth-child(1) { animation-delay: 0.04s; }
  .grid-area .section:nth-child(2) { animation-delay: 0.08s; }
  .grid-area .section:nth-child(3) { animation-delay: 0.12s; }
  .grid-area .section:nth-child(4) { animation-delay: 0.16s; }
  .grid-area .section:nth-child(5) { animation-delay: 0.20s; }


  /* === Slot number pop on change === */
  @keyframes slot-pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .slot-num.pop { animation: slot-pop 0.25s cubic-bezier(0.22, 1, 0.36, 1); }

  /* === Switch-style slide toggle for macro mode === */
  .switch-toggle {
    width: 58px; height: 30px; border-radius: 15px; padding: 2px;
    background: rgba(255,255,255,0.12); border: none; cursor: pointer;
    position: relative; transition: background 0.25s ease;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
    -webkit-tap-highlight-color: transparent;
  }
  .switch-toggle.on { background: var(--green); }
  .switch-toggle .knob {
    width: 26px; height: 26px; border-radius: 50%;
    background: #fff; display: block;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .switch-toggle.on .knob { transform: translateX(28px); }

  /* === Recording glow ring === */
  @keyframes rec-ring {
    0%, 100% { box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 0 0 3px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.15), 0 0 0 0 rgba(230,0,18,0); }
    50% { box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 0 0 3px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.15), 0 0 0 10px rgba(230,0,18,0.25); }
  }
  .btn-face.recording {
    animation: rec-ring 1.2s ease-in-out infinite;
  }

  /* === Button press feedback === */
  .btn-face { transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.12s ease, background 0.2s ease, opacity 0.2s ease; }
  .dpad-btn { transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.12s ease; }

  /* === Slot name fade === */
  .slot-name { transition: opacity 0.2s ease; }
  .slot-name.fading { opacity: 0; }

  /* === Responsive grid layout === */
  .grid-area {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
  }

  /* Tablet: 2-column grid for main controls, library spans full width */
  @media (min-width: 600px) {
    .content-wrap { padding: 0 0.5rem; }
    .grid-area {
      grid-template-columns: 1fr 1fr;
      gap: 0 0.25rem;
    }
    .grid-area .section { margin: 0.6rem 0.5rem; }
    .grid-span-full { grid-column: 1 / -1; }
    .status-bar { border-radius: 0 0 var(--radius) var(--radius); }
    .section { transition: box-shadow 0.2s ease, border-color 0.2s ease; }
    .section:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      border-color: rgba(255,255,255,0.1);
    }
    .macro-tile:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      border-color: rgba(255,255,255,0.15);
    }
    .macro-tile.selected:hover {
      border-color: var(--joycon-blue);
      box-shadow: 0 0 0 2px rgba(0,195,227,0.45), 0 6px 20px rgba(0,195,227,0.2);
    }
    .macro-tile-actions .tile-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
    .macro-tile-actions .tile-btn.tile-btn-del:hover { color: #ff4444; background: rgba(230,0,18,0.08); }
    .controller-section { margin: 0.6rem 0.5rem; }
    .controller-section:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.25); }
  }

  /* Desktop: wider spacing, capped width */
  @media (min-width: 900px) {
    .content-wrap { padding: 0 1rem; }
    .grid-area .section { margin: 0.75rem 0.5rem; padding: 1.25rem; }
    .status-bar { margin: 0 0.5rem; }
    .macro-list-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.75rem; }
    .controller-svg-wrap { max-width: 380px; }
    .controller-section { padding: 1rem 0.5rem 0.8rem; }
  }
</style>
</head>
<body>

<div class="content-wrap">

<div class="status-bar">
  <h1><span class="power-led"></span>Nintendo Pi</h1>
  <div class="status-pills">
    <div class="status-pill"><span class="status-dot red" id="piDot"></span><span id="piLabel">Pi</span></div>
    <div class="status-pill"><span class="status-dot red" id="ctrlDot"></span><span id="ctrlLabel">Controller</span></div>
    <div class="status-pill"><span class="status-dot red" id="switchDot"></span><span id="switchLabel">Switch</span></div>
  </div>
</div>

<div class="controller-section">
  <div class="controller-svg-wrap disconnected" id="controllerWrap">
    <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
      <!-- Controller body -->
      <path class="ctrl-body" d="M40,18 Q40,8 50,8 L150,8 Q160,8 160,18 L160,55 Q160,70 150,78 L140,85 Q132,92 120,92 L112,92 Q105,92 100,85 Q95,92 88,92 L80,92 Q68,92 60,85 L50,78 Q40,70 40,55 Z"/>
      <!-- Left grip -->
      <path class="ctrl-grip-l" d="M40,18 Q40,8 50,8 L68,8 L68,55 Q68,70 60,78 L50,78 Q40,70 40,55 Z" rx="4"/>
      <!-- Right grip -->
      <path class="ctrl-grip-r" d="M132,8 L150,8 Q160,8 160,18 L160,55 Q160,70 150,78 L140,78 Q132,70 132,55 Z" rx="4"/>

      <!-- Left stick -->
      <circle class="ctrl-stick-base" cx="62" cy="38" r="12"/>
      <circle class="ctrl-stick-cap" id="ctrlLStick" cx="62" cy="38" r="8"/>

      <!-- D-pad -->
      <g id="ctrlDpad">
        <rect class="ctrl-dpad" x="72" y="50" width="16" height="5" rx="1"/>
        <rect class="ctrl-dpad" x="77.5" y="44.5" width="5" height="16" rx="1"/>
        <rect class="ctrl-dpad-btn" id="ctrlDLeft" x="72" y="50" width="5.5" height="5" rx="1"/>
        <rect class="ctrl-dpad-btn" id="ctrlDRight" x="82.5" y="50" width="5.5" height="5" rx="1"/>
        <rect class="ctrl-dpad-btn" id="ctrlDUp" x="77.5" y="44.5" width="5" height="5.5" rx="1"/>
        <rect class="ctrl-dpad-btn" id="ctrlDDown" x="77.5" y="55" width="5" height="5.5" rx="1"/>
      </g>

      <!-- Face buttons -->
      <g id="ctrlBtnA" class="ctrl-btn">
        <circle cx="138" cy="38" r="5.5"/>
        <text class="ctrl-btn-label" x="138" y="38">A</text>
      </g>
      <g id="ctrlBtnB" class="ctrl-btn">
        <circle cx="128" cy="45" r="5.5"/>
        <text class="ctrl-btn-label" x="128" y="45">B</text>
      </g>
      <g id="ctrlBtnX" class="ctrl-btn">
        <circle cx="128" cy="31" r="5.5"/>
        <text class="ctrl-btn-label" x="128" y="31">X</text>
      </g>
      <g id="ctrlBtnY" class="ctrl-btn">
        <circle cx="118" cy="38" r="5.5"/>
        <text class="ctrl-btn-label" x="118" y="38">Y</text>
      </g>

      <!-- Right stick -->
      <circle class="ctrl-stick-base" cx="118" cy="58" r="12"/>
      <circle class="ctrl-stick-cap" id="ctrlRStick" cx="118" cy="58" r="8"/>

      <!-- Bumpers (L/R) -->
      <rect class="ctrl-bumper" id="ctrlL" x="44" y="5" width="24" height="6" rx="3"/>
      <rect class="ctrl-bumper" id="ctrlR" x="132" y="5" width="24" height="6" rx="3"/>

      <!-- Triggers (ZL/ZR) -->
      <rect class="ctrl-trigger" id="ctrlZL" x="46" y="0" width="20" height="5" rx="2"/>
      <rect class="ctrl-trigger" id="ctrlZR" x="134" y="0" width="20" height="5" rx="2"/>

      <!-- Minus / Plus -->
      <circle class="ctrl-special" id="ctrlMinus" cx="84" cy="24" r="3.5"/>
      <circle class="ctrl-special" id="ctrlPlus" cx="116" cy="24" r="3.5"/>
      <!-- Minus/Plus symbols -->
      <line x1="82" y1="24" x2="86" y2="24" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
      <line x1="114" y1="24" x2="118" y2="24" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>
      <line x1="116" y1="22" x2="116" y2="26" stroke="rgba(255,255,255,0.35)" stroke-width="0.8"/>

      <!-- Home button -->
      <circle class="ctrl-home" id="ctrlHome" cx="108" cy="24" r="4"/>
      <circle cx="108" cy="24" r="2" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>

      <!-- Capture button -->
      <rect class="ctrl-capture" id="ctrlCapture" x="90" y="21" width="6" height="6" rx="1"/>
      <rect x="91.5" y="22.5" width="3" height="3" rx="0.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.4"/>

      <!-- Stick click indicators (L3/R3) — tiny dots -->
      <circle id="ctrlL3" cx="62" cy="38" r="2" fill="transparent" stroke="none"/>
      <circle id="ctrlR3" cx="118" cy="58" r="2" fill="transparent" stroke="none"/>
    </svg>
  </div>
  <div class="ctrl-status-text" id="ctrlStatusText">Waiting for controller...</div>
  <div class="ctrl-playback-progress" id="ctrlPlaybackProgress">
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="vizProgress"></div></div>
    <div class="progress-label" id="vizProgressLabel">0 / 0</div>
  </div>
</div>

<div class="grid-area">

<div class="section">
  <div class="section-title">Macro Mode</div>
  <div class="toggle-row">
    <span class="label">Macro Mode</span>
    <span class="toggle-status off" id="macroModeStatus">OFF</span>
    <button class="switch-toggle" id="btnMacroMode" onclick="sendCmd('TOGGLE_MACRO_MODE')">
      <span class="knob"></span>
    </button>
  </div>
</div>

<div class="section">
  <div class="section-title">Recording</div>
  <div style="display:flex;align-items:center;justify-content:center;gap:0.8rem">
    <button class="btn btn-accent btn-face" id="btnRecord" onclick="sendCmd('TOGGLE_RECORDING')" style="width:68px;height:68px;font-size:0.75rem">
      REC
    </button>
    <span class="rec-status" id="recStatus" style="display:none">REC</span>
  </div>
</div>

<div class="section grid-span-full">
  <div class="section-title">Slot &amp; Playback</div>
  <div class="slot-nav">
    <button class="btn dpad-btn" onclick="sendCmd('PREV_SLOT')">&larr;</button>
    <div class="slot-info">
      <div class="slot-num" id="slotNum">0</div>
      <div class="slot-name" id="slotName">--</div>
    </div>
    <button class="btn dpad-btn" onclick="sendCmd('NEXT_SLOT')">&rarr;</button>
  </div>
  <div class="playback-controls">
    <button class="btn btn-green btn-face" id="btnPlay" onclick="sendCmd('PLAY_MACRO')">PLAY</button>
    <button class="btn btn-red btn-face" id="btnStop" onclick="sendCmd('STOP_PLAYBACK')">STOP</button>
    <button class="btn btn-dark btn-face" id="btnLoop" onclick="sendCmd('TOGGLE_LOOP')" style="font-size:0.7rem">LOOP<br>OFF</button>
  </div>
  <div class="speed-row" id="speedRow">
    <button class="btn btn-dark" onclick="setSpeed(0.25)">0.25x</button>
    <button class="btn btn-dark" onclick="setSpeed(0.5)">0.5x</button>
    <button class="btn btn-dark active" onclick="setSpeed(1)">1x</button>
    <button class="btn btn-dark" onclick="setSpeed(2)">2x</button>
    <button class="btn btn-dark" onclick="setSpeed(4)">4x</button>
  </div>
</div>

<div class="section grid-span-full">
  <div class="section-title">Macro Library</div>
  <div id="macroList"><div class="empty-msg">No macros yet</div></div>
</div>

</div><!-- grid-area -->
</div><!-- content-wrap -->

<div class="modal-overlay" id="renameModal">
  <div class="modal">
    <h3>Rename Macro</h3>
    <input type="text" id="renameInput" placeholder="New name" autocomplete="off">
    <div class="modal-btns">
      <button class="btn btn-dark" onclick="closeRename()">Cancel</button>
      <button class="btn btn-blue" onclick="submitRename()">Rename</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <h3>Delete Macro</h3>
    <p id="deleteMsg" style="font-size:0.9rem;color:var(--muted);margin-bottom:1rem;font-weight:600"></p>
    <div class="modal-btns">
      <button class="btn btn-dark" onclick="closeDelete()">Cancel</button>
      <button class="btn btn-red" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
(function() {
  var state = {};
  var macros = [];
  var renameId = null;
  var es = null;
  // === Nintendo-style synthesized UI sound effects ===
  var audioCtx = null;
  var sfxEnabled = true;
  var sfxUnlocked = false;

  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // Unlock audio on first user interaction (required by mobile browsers)
  function unlockAudio() {
    if (sfxUnlocked) return;
    sfxUnlocked = true;
    var ctx = getAudioCtx();
    var b = ctx.createBuffer(1, 1, ctx.sampleRate);
    var s = ctx.createBufferSource();
    s.buffer = b;
    s.connect(ctx.destination);
    s.start(0);
  }
  document.addEventListener('touchstart', unlockAudio, { once: true });
  document.addEventListener('click', unlockAudio, { once: true });

  // Play a tone: frequency (Hz), duration (s), volume (0-1), type, optional ramp
  function playTone(freq, dur, vol, type, rampTo) {
    if (!sfxEnabled) return;
    var ctx = getAudioCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    if (rampTo) {
      osc.frequency.exponentialRampToValueAtTime(rampTo, ctx.currentTime + dur);
    }
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + dur);
  }

  // Play a quick noise click (like a soft mechanical tick)
  function playClick(vol) {
    if (!sfxEnabled) return;
    var ctx = getAudioCtx();
    var bufferSize = Math.floor(ctx.sampleRate * 0.012);
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) {
      // Shaped noise burst — sharp attack, fast decay
      var env = Math.exp(-i / (bufferSize * 0.15));
      data[i] = (Math.random() * 2 - 1) * env;
    }
    var src = ctx.createBufferSource();
    var gain = ctx.createGain();
    src.buffer = buffer;
    gain.gain.setValueAtTime(vol || 0.15, ctx.currentTime);
    src.connect(gain);
    gain.connect(ctx.destination);
    src.start(ctx.currentTime);
  }

  // Sound library — short, musical, Switch-OS-inspired
  var sfx = {
    // Navigation tick — soft high pop
    nav: function() {
      playClick(0.12);
      playTone(1800, 0.04, 0.08, 'sine');
    },
    // Confirmation — two-note rising chime
    confirm: function() {
      playTone(880, 0.08, 0.1, 'sine');
      setTimeout(function() { playTone(1320, 0.1, 0.1, 'sine'); }, 60);
    },
    // Toggle ON — bright rising sweep
    toggleOn: function() {
      playTone(660, 0.12, 0.1, 'sine', 1200);
    },
    // Toggle OFF — descending soft tone
    toggleOff: function() {
      playTone(880, 0.12, 0.08, 'sine', 440);
    },
    // Record start — two quick ascending pips
    recStart: function() {
      playTone(740, 0.06, 0.1, 'square');
      setTimeout(function() { playTone(988, 0.08, 0.1, 'square'); }, 70);
    },
    // Record stop — single descending tone
    recStop: function() {
      playTone(988, 0.1, 0.1, 'square', 520);
    },
    // Play macro — cheerful three-note ascending
    play: function() {
      playTone(660, 0.07, 0.09, 'sine');
      setTimeout(function() { playTone(880, 0.07, 0.09, 'sine'); }, 60);
      setTimeout(function() { playTone(1100, 0.1, 0.09, 'sine'); }, 120);
    },
    // Stop — soft thud
    stop: function() {
      playTone(220, 0.1, 0.12, 'sine', 110);
      playClick(0.1);
    },
    // Slot change — crisp tick
    slot: function() {
      playClick(0.15);
      playTone(1400, 0.035, 0.07, 'triangle');
    },
    // Delete — low warning
    del: function() {
      playTone(330, 0.08, 0.1, 'sawtooth', 220);
      setTimeout(function() { playTone(220, 0.12, 0.08, 'sawtooth', 165); }, 80);
    },
    // Generic button press
    press: function() {
      playClick(0.1);
    }
  };

  function connect() {
    es = new EventSource('/events');

    es.onopen = function() {
      setStatusDot('piDot', 'green');
    };

    es.onerror = function() {
      setStatusDot('piDot', 'red');
      setStatusDot('ctrlDot', 'red');
      setStatusDot('switchDot', 'red');
    };

    es.onmessage = function(e) {
      try {
        var msg = JSON.parse(e.data);
        if (msg.type === 'init') {
          state = msg.state;
          macros = msg.macros || [];
          updateUI();
          renderMacros();
        } else if (msg.type === 'state_update') {
          state = msg.state;
          updateUI();
        } else if (msg.type === 'macro_list') {
          macros = msg.macros || [];
          renderMacros();
          updateSlotName();
        }
      } catch(err) {}
    };
  }

  connect();

  function setStatusDot(id, color) {
    var dot = document.getElementById(id);
    dot.className = 'status-dot ' + color;
  }

  function updateUI() {
    // Update hardware status dots
    setStatusDot('ctrlDot', state.usb_connected ? 'green' : 'yellow');
    setStatusDot('switchDot', state.bt_connected ? 'green' : 'red');
    var modeEl = document.getElementById('macroModeStatus');
    var toggleBtn = document.getElementById('btnMacroMode');
    if (state.macro_mode) {
      modeEl.textContent = 'ON';
      modeEl.className = 'toggle-status on';
      toggleBtn.classList.add('on');
    } else {
      modeEl.textContent = 'OFF';
      modeEl.className = 'toggle-status off';
      toggleBtn.classList.remove('on');
    }

    var slotEl = document.getElementById('slotNum');
    var newSlotText = state.slot_count > 0
      ? (state.current_slot + 1) + ' / ' + state.slot_count
      : '0 / 0';
    if (slotEl.textContent !== newSlotText) {
      slotEl.textContent = newSlotText;
      slotEl.classList.remove('pop');
      void slotEl.offsetWidth; // reflow to restart animation
      slotEl.classList.add('pop');
    }
    updateSlotName();

    var recBtn = document.getElementById('btnRecord');
    var recStatus = document.getElementById('recStatus');
    if (state.recording) {
      recBtn.textContent = 'STOP';
      recBtn.className = 'btn btn-yellow btn-face recording';
      recBtn.style.width = '68px'; recBtn.style.height = '68px'; recBtn.style.fontSize = '0.75rem';
      recStatus.style.display = '';
      recStatus.className = 'rec-status active';
    } else {
      recBtn.textContent = 'REC';
      recBtn.className = 'btn btn-accent btn-face';
      recBtn.style.width = '68px'; recBtn.style.height = '68px'; recBtn.style.fontSize = '0.75rem';
      recStatus.style.display = 'none';
    }

    var playBtn = document.getElementById('btnPlay');
    if (state.playing) {
      playBtn.innerHTML = '&#9654;';
      playBtn.disabled = true;
      playBtn.style.opacity = '0.5';
    } else {
      playBtn.textContent = 'PLAY';
      playBtn.disabled = false;
      playBtn.style.opacity = '';
    }

    var loopBtn = document.getElementById('btnLoop');
    if (state.looping) {
      loopBtn.innerHTML = 'LOOP<br>ON';
      loopBtn.className = 'btn btn-blue btn-face';
      loopBtn.style.fontSize = '0.7rem';
    } else {
      loopBtn.innerHTML = 'LOOP<br>OFF';
      loopBtn.className = 'btn btn-dark btn-face';
      loopBtn.style.fontSize = '0.7rem';
    }

    var speedBtns = document.getElementById('speedRow').children;
    var speeds = [0.25, 0.5, 1, 2, 4];
    for (var i = 0; i < speedBtns.length; i++) {
      speedBtns[i].className = state.playback_speed === speeds[i]
        ? 'btn btn-dark active' : 'btn btn-dark';
    }

    // Playback progress bar (in controller section)
    var progressWrap = document.getElementById('ctrlPlaybackProgress');
    if (state.playing && state.playback_input) {
      progressWrap.classList.add('show');
      var pct = state.playback_frame_count > 0
        ? (state.playback_frame / state.playback_frame_count * 100) : 0;
      document.getElementById('vizProgress').style.width = pct + '%';
      document.getElementById('vizProgressLabel').textContent =
        state.playback_frame + ' / ' + state.playback_frame_count;
    } else {
      progressWrap.classList.remove('show');
    }

    // Update controller visualization
    updateController();
  }

  // === Controller visualization ===
  var CTRL_BTN_MAP = {
    'A': 'ctrlBtnA', 'B': 'ctrlBtnB', 'X': 'ctrlBtnX', 'Y': 'ctrlBtnY',
    'L': 'ctrlL', 'R': 'ctrlR', 'ZL': 'ctrlZL', 'ZR': 'ctrlZR',
    'Plus': 'ctrlPlus', 'Minus': 'ctrlMinus',
    'Home': 'ctrlHome', 'Capture': 'ctrlCapture',
    'L3': 'ctrlL3', 'R3': 'ctrlR3',
    'DUp': 'ctrlDUp', 'DDown': 'ctrlDDown', 'DLeft': 'ctrlDLeft', 'DRight': 'ctrlDRight'
  };
  var CTRL_BTN_ACTIVE_CLASS = {
    'A': 'active-a', 'B': 'active-b', 'X': 'active-x', 'Y': 'active-y'
  };

  // Stick rest positions (cx, cy) in SVG coords
  var LSTICK_REST = [62, 38], RSTICK_REST = [118, 58], STICK_RANGE = 8;

  function updateController() {
    var wrap = document.getElementById('controllerWrap');
    var statusText = document.getElementById('ctrlStatusText');
    var connected = state.usb_connected;

    // Connection state
    if (connected) {
      wrap.classList.remove('disconnected');
    } else {
      wrap.classList.add('disconnected');
    }

    // Recording pulse
    if (state.recording) {
      wrap.classList.add('recording');
    } else {
      wrap.classList.remove('recording');
    }

    // Status text
    if (!connected) {
      statusText.textContent = 'Waiting for controller...';
      statusText.className = 'ctrl-status-text';
    } else if (state.recording) {
      statusText.textContent = 'Recording';
      statusText.className = 'ctrl-status-text recording';
    } else if (state.playing) {
      statusText.textContent = 'Playing';
      statusText.className = 'ctrl-status-text playing';
    } else if (state.macro_mode) {
      statusText.textContent = 'Macro mode active';
      statusText.className = 'ctrl-status-text';
    } else {
      statusText.textContent = 'Connected';
      statusText.className = 'ctrl-status-text';
    }

    // Reset all buttons
    var allIds = Object.values(CTRL_BTN_MAP);
    for (var i = 0; i < allIds.length; i++) {
      var el = document.getElementById(allIds[i]);
      if (el) {
        el.classList.remove('active', 'active-a', 'active-b', 'active-x', 'active-y');
      }
    }

    // Reset sticks to center
    var lStick = document.getElementById('ctrlLStick');
    var rStick = document.getElementById('ctrlRStick');
    lStick.setAttribute('cx', LSTICK_REST[0]);
    lStick.setAttribute('cy', LSTICK_REST[1]);
    lStick.classList.remove('active');
    rStick.setAttribute('cx', RSTICK_REST[0]);
    rStick.setAttribute('cy', RSTICK_REST[1]);
    rStick.classList.remove('active');

    // Animate from playback input
    if (state.playing && state.playback_input) {
      var pi = state.playback_input;

      // Light up active buttons
      for (var j = 0; j < pi.buttons.length; j++) {
        var btn = pi.buttons[j];
        var elId = CTRL_BTN_MAP[btn];
        if (elId) {
          var btnEl = document.getElementById(elId);
          if (btnEl) {
            var cls = CTRL_BTN_ACTIVE_CLASS[btn];
            btnEl.classList.add(cls || 'active');
          }
        }
      }

      // Move sticks
      var ls = pi.left_stick;
      var rs = pi.right_stick;
      lStick.setAttribute('cx', LSTICK_REST[0] + ls[0] * STICK_RANGE);
      lStick.setAttribute('cy', LSTICK_REST[1] - ls[1] * STICK_RANGE);
      if (Math.abs(ls[0]) > 0.05 || Math.abs(ls[1]) > 0.05) lStick.classList.add('active');
      rStick.setAttribute('cx', RSTICK_REST[0] + rs[0] * STICK_RANGE);
      rStick.setAttribute('cy', RSTICK_REST[1] - rs[1] * STICK_RANGE);
      if (Math.abs(rs[0]) > 0.05 || Math.abs(rs[1]) > 0.05) rStick.classList.add('active');
    }
  }

  window.setSpeed = function(speed) {
    sfx.nav();
    sendCmd('SET_PLAYBACK_SPEED', speed);
  }

  function updateSlotName() {
    var nameEl = document.getElementById('slotName');
    var newName;
    if (state.current_macro_name) {
      newName = state.current_macro_name;
    } else if (macros.length > 0 && state.current_slot < macros.length) {
      newName = macros[state.current_slot].name;
    } else {
      newName = '--';
    }
    if (nameEl.textContent !== newName) {
      nameEl.classList.add('fading');
      setTimeout(function() {
        nameEl.textContent = newName;
        nameEl.classList.remove('fading');
      }, 150);
    }
  }

  var TILE_COLORS = ['color-0', 'color-1', 'color-2', 'color-3'];

  function renderMacros() {
    var container = document.getElementById('macroList');
    if (!macros || macros.length === 0) {
      container.innerHTML = '<div class="empty-msg">'
        + '<span class="empty-icon">&#127918;</span>'
        + 'No macros yet'
        + '<span class="empty-hint">Record your first macro to see it here</span>'
        + '</div>';
      return;
    }
    var html = '<div class="macro-list-grid">';
    for (var i = 0; i < macros.length; i++) {
      var m = macros[i];
      var dur = m.duration_ms >= 1000
        ? (m.duration_ms / 1000).toFixed(1) + 's'
        : m.duration_ms + 'ms';
      var sel = (state.current_slot === i) ? ' selected' : '';
      var colorClass = TILE_COLORS[i % TILE_COLORS.length];
      html += '<div class="macro-tile' + sel + '" onclick="selectSlot(' + i + ')">'
        + '<div class="macro-tile-accent ' + colorClass + '"></div>'
        + '<div class="macro-tile-body">'
        + '<div class="macro-tile-slot">Slot ' + (i + 1) + '</div>'
        + '<div class="macro-tile-name">' + escHtml(m.name) + '</div>'
        + '<div class="macro-tile-meta"><span>' + m.frame_count + ' fr</span><span>' + dur + '</span></div>'
        + '</div>'
        + '<div class="macro-tile-actions">'
        + '<button class="tile-btn" onclick="event.stopPropagation();openRename(' + m.id + ',\'' + escAttr(m.name) + '\')">Rename</button>'
        + '<button class="tile-btn tile-btn-del" onclick="event.stopPropagation();deleteMacro(' + m.id + ',\'' + escAttr(m.name) + '\')">Delete</button>'
        + '</div></div>';
    }
    html += '</div>';
    container.innerHTML = html;
  }

  function escHtml(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }
  function escAttr(s) {
    return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  window.sendCmd = function(cmd, data) {
    // Play appropriate sound effect per command
    switch (cmd) {
      case 'TOGGLE_MACRO_MODE':
        (state.macro_mode ? sfx.toggleOff : sfx.toggleOn)(); break;
      case 'TOGGLE_RECORDING':
        (state.recording ? sfx.recStop : sfx.recStart)(); break;
      case 'PREV_SLOT':
      case 'NEXT_SLOT':
        sfx.slot(); break;
      case 'PLAY_MACRO':
        sfx.play(); break;
      case 'STOP_PLAYBACK':
        sfx.stop(); break;
      case 'TOGGLE_LOOP':
        (state.looping ? sfx.toggleOff : sfx.toggleOn)(); break;
      case 'SET_PLAYBACK_SPEED':
        sfx.nav(); break;
      default:
        sfx.press(); break;
    }
    fetch('/api/cmd', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd: cmd, data: data || null })
    });
  };

  window.selectSlot = function(idx) {
    sfx.slot();
    fetch('/api/cmd', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd: 'SELECT_SLOT', data: idx })
    });
  };

  window.openRename = function(id, name) {
    sfx.nav();
    renameId = id;
    document.getElementById('renameInput').value = name;
    document.getElementById('renameModal').classList.add('show');
    setTimeout(function() { document.getElementById('renameInput').focus(); }, 100);
  };

  window.closeRename = function() {
    sfx.press();
    document.getElementById('renameModal').classList.remove('show');
    renameId = null;
  };

  window.submitRename = function() {
    var name = document.getElementById('renameInput').value.trim();
    if (name && renameId !== null) {
      sfx.confirm();
      window.sendCmd('RENAME_MACRO', [renameId, name]);
    }
    closeRename();
  };

  var deleteId = null;

  window.deleteMacro = function(id, name) {
    sfx.del();
    deleteId = id;
    document.getElementById('deleteMsg').textContent = 'Delete "' + name + '"? This can\'t be undone.';
    document.getElementById('deleteModal').classList.add('show');
  };

  window.closeDelete = function() {
    sfx.press();
    document.getElementById('deleteModal').classList.remove('show');
    deleteId = null;
  };

  window.confirmDelete = function() {
    if (deleteId !== null) {
      sfx.confirm();
      window.sendCmd('DELETE_MACRO', deleteId);
    }
    closeDelete();
  };

  document.getElementById('renameInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') window.submitRename();
    if (e.key === 'Escape') window.closeRename();
  });

  document.getElementById('renameModal').addEventListener('click', function(e) {
    if (e.target === this) window.closeRename();
  });

  document.getElementById('deleteModal').addEventListener('click', function(e) {
    if (e.target === this) window.closeDelete();
  });
})();
</script>
</body>
</html>
