<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Nintendo Pi</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #2d2d2d; --surface: #3a3a3a; --card: #444;
    --accent: #e60012; --accent-hover: #c7000f;
    --text: #f0f0f0; --muted: #999;
    --green: #49b84f; --red: #e60012; --yellow: #f5c518; --blue: #4a9bd9;
    --radius: 14px; --radius-sm: 10px;
  }
  html { font-size: 16px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 0 0 2rem;
    -webkit-tap-highlight-color: transparent;
  }
  /* Subtle diamond crosshatch pattern nod to SNES controller grip */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; opacity: 0.03;
    background-image:
      linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%),
      linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
  }
  .status-bar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.6rem 1rem; background: #222;
    border-bottom: 3px solid var(--accent);
  }
  .status-bar h1 {
    font-size: 1rem; font-weight: 700; letter-spacing: 0.04em;
    color: var(--text);
  }
  .status-pills { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
  .status-pill {
    display: flex; align-items: center; gap: 0.25rem;
    font-size: 0.7rem; color: var(--muted); padding: 0.15rem 0.5rem;
    background: rgba(255,255,255,0.06); border-radius: 20px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block; transition: background 0.3s;
  }
  .status-dot.green { background: var(--green); box-shadow: 0 0 6px rgba(73,184,79,0.5); }
  .status-dot.red { background: var(--red); }
  .status-dot.yellow { background: var(--yellow); box-shadow: 0 0 6px rgba(245,197,24,0.4); }
  .section {
    margin: 0.6rem 0.75rem; padding: 1rem;
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .section-title {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); margin-bottom: 0.6rem; font-weight: 600;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: var(--radius-sm); cursor: pointer;
    font-size: 0.95rem; font-weight: 600; color: #fff;
    padding: 0.7rem 1.2rem; min-height: 46px;
    transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    -webkit-user-select: none; user-select: none;
    box-shadow: 0 2px 0 rgba(0,0,0,0.3);
    position: relative;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 0 0 rgba(0,0,0,0.3); }
  .btn:disabled { opacity: 0.35; pointer-events: none; }
  .btn-accent { background: var(--accent); }
  .btn-green { background: var(--green); }
  .btn-blue { background: var(--blue); }
  .btn-yellow { background: var(--yellow); color: #222; }
  .btn-dark { background: rgba(255,255,255,0.1); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
  .btn-red { background: var(--red); }
  .toggle-row { display: flex; align-items: center; gap: 1rem; }
  .toggle-row .label { flex: 1; font-size: 1.1rem; font-weight: 500; }
  .toggle-status {
    font-size: 0.85rem; padding: 0.3rem 0.8rem; border-radius: 20px; font-weight: 600;
  }
  .toggle-status.on { background: var(--green); color: #fff; }
  .toggle-status.off { background: rgba(255,255,255,0.1); color: var(--muted); }
  .slot-nav {
    display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem;
  }
  .slot-nav .btn { flex: 0 0 auto; padding: 0.8rem; font-size: 1.3rem; border-radius: 50%; width: 46px; height: 46px; }
  .slot-info { flex: 1; text-align: center; min-width: 0; }
  .slot-num { font-size: 1.5rem; font-weight: 700; }
  .slot-name {
    font-size: 0.85rem; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .playback-row { display: flex; gap: 0.5rem; }
  .playback-row .btn { flex: 1; border-radius: var(--radius-sm); }
  .speed-row { display: flex; gap: 0.4rem; margin-top: 0.6rem; }
  .speed-row .btn {
    flex: 1; padding: 0.5rem 0.3rem; font-size: 0.8rem; min-height: 38px;
    border-radius: 20px;
  }
  .speed-row .btn.active { background: var(--blue); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
  .rec-status {
    display: inline-block; padding: 0.25rem 0.6rem; border-radius: 20px;
    font-size: 0.8rem; font-weight: 600; margin-left: 0.5rem;
  }
  .rec-status.active { background: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .viz-section { display: none; }
  .viz-section.show { display: block; }
  .progress-bar-outer {
    width: 100%; height: 6px; background: rgba(255,255,255,0.08);
    border-radius: 3px; overflow: hidden; margin-bottom: 0.3rem;
  }
  .progress-bar-inner {
    height: 100%; background: var(--accent); border-radius: 3px;
    transition: width 0.15s linear; width: 0%;
  }
  .progress-label { font-size: 0.7rem; color: var(--muted); text-align: center; margin-bottom: 0.6rem; }
  .sticks-row { display: flex; gap: 1.5rem; justify-content: center; margin-bottom: 0.6rem; }
  .stick-container { text-align: center; }
  .stick-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.25rem; font-weight: 600; }
  .stick-circle {
    width: 84px; height: 84px; border-radius: 50%; position: relative;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 70%);
    border: 2px solid rgba(255,255,255,0.12);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
  }
  .stick-dot {
    width: 14px; height: 14px; border-radius: 50%; background: var(--muted);
    position: absolute; transform: translate(-50%, -50%);
    transition: left 0.1s linear, top 0.1s linear, background 0.1s;
    left: 50%; top: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .stick-dot.active { background: var(--green); box-shadow: 0 0 8px rgba(73,184,79,0.5); }
  .btn-pills {
    display: flex; flex-wrap: wrap; gap: 0.3rem; justify-content: center;
    min-height: 1.6rem;
  }
  .btn-pill {
    display: inline-block; padding: 0.2rem 0.55rem; border-radius: 20px;
    font-size: 0.75rem; font-weight: 700; color: #fff;
    background: var(--accent);
  }
  /* Color specific button pills like ABXY face buttons */
  .btn-pill[data-btn="A"] { background: var(--green); }
  .btn-pill[data-btn="B"] { background: var(--red); }
  .btn-pill[data-btn="X"] { background: var(--blue); }
  .btn-pill[data-btn="Y"] { background: var(--yellow); color: #222; }
  .macro-item {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.7rem 0; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .macro-item:last-child { border-bottom: none; }
  .macro-info { flex: 1; min-width: 0; }
  .macro-name {
    font-weight: 500; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .macro-meta { font-size: 0.75rem; color: var(--muted); }
  .macro-actions { display: flex; gap: 0.3rem; }
  .macro-actions .btn { padding: 0.4rem 0.6rem; font-size: 0.8rem; min-height: 36px; border-radius: 8px; }
  .empty-msg { color: var(--muted); font-size: 0.9rem; text-align: center; padding: 1rem; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7); align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface); border-radius: var(--radius);
    padding: 1.5rem; width: 90%; max-width: 340px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .modal h3 { margin-bottom: 1rem; font-size: 1.1rem; }
  .modal input {
    width: 100%; padding: 0.7rem; border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,0.15); background: var(--bg);
    color: var(--text); font-size: 1rem; margin-bottom: 1rem;
  }
  .modal input:focus { outline: none; border-color: var(--accent); }
  .modal-btns { display: flex; gap: 0.5rem; }
  .modal-btns .btn { flex: 1; }
</style>
</head>
<body>

<div class="status-bar">
  <h1>Nintendo Pi</h1>
  <div class="status-pills">
    <div class="status-pill"><span class="status-dot red" id="piDot"></span><span id="piLabel">Pi</span></div>
    <div class="status-pill"><span class="status-dot red" id="ctrlDot"></span><span id="ctrlLabel">Controller</span></div>
    <div class="status-pill"><span class="status-dot red" id="switchDot"></span><span id="switchLabel">Switch</span></div>
  </div>
</div>

<div class="section">
  <div class="section-title">Macro Mode</div>
  <div class="toggle-row">
    <span class="label">Macro Mode</span>
    <button class="btn btn-dark" id="btnMacroMode" onclick="sendCmd('TOGGLE_MACRO_MODE')">
      <span class="toggle-status off" id="macroModeStatus">OFF</span>
    </button>
  </div>
</div>

<div class="section">
  <div class="section-title">Slot &amp; Playback</div>
  <div class="slot-nav">
    <button class="btn btn-dark" onclick="sendCmd('PREV_SLOT')">&larr;</button>
    <div class="slot-info">
      <div class="slot-num" id="slotNum">0</div>
      <div class="slot-name" id="slotName">--</div>
    </div>
    <button class="btn btn-dark" onclick="sendCmd('NEXT_SLOT')">&rarr;</button>
  </div>
  <div class="playback-row">
    <button class="btn btn-green" id="btnPlay" onclick="sendCmd('PLAY_MACRO')">Play</button>
    <button class="btn btn-red" id="btnStop" onclick="sendCmd('STOP_PLAYBACK')">Stop</button>
    <button class="btn btn-dark" id="btnLoop" onclick="sendCmd('TOGGLE_LOOP')">Loop: OFF</button>
  </div>
  <div class="speed-row" id="speedRow">
    <button class="btn btn-dark" onclick="setSpeed(0.25)">0.25x</button>
    <button class="btn btn-dark" onclick="setSpeed(0.5)">0.5x</button>
    <button class="btn btn-dark active" onclick="setSpeed(1)">1x</button>
    <button class="btn btn-dark" onclick="setSpeed(2)">2x</button>
    <button class="btn btn-dark" onclick="setSpeed(4)">4x</button>
  </div>
</div>

<div class="section viz-section" id="vizSection">
  <div class="section-title">Playback</div>
  <div class="progress-bar-outer"><div class="progress-bar-inner" id="vizProgress"></div></div>
  <div class="progress-label" id="vizProgressLabel">0 / 0</div>
  <div class="sticks-row">
    <div class="stick-container">
      <div class="stick-label">L</div>
      <div class="stick-circle"><div class="stick-dot" id="vizLeftDot"></div></div>
    </div>
    <div class="stick-container">
      <div class="stick-label">R</div>
      <div class="stick-circle"><div class="stick-dot" id="vizRightDot"></div></div>
    </div>
  </div>
  <div class="btn-pills" id="vizButtons"></div>
</div>

<div class="section">
  <div class="section-title">Recording</div>
  <div style="display:flex;align-items:center">
    <button class="btn btn-accent" id="btnRecord" onclick="sendCmd('TOGGLE_RECORDING')" style="flex:1">
      Start Recording
    </button>
    <span class="rec-status" id="recStatus" style="display:none">REC</span>
  </div>
</div>

<div class="section">
  <div class="section-title">Macro Library</div>
  <div id="macroList"><div class="empty-msg">No macros yet</div></div>
</div>

<div class="modal-overlay" id="renameModal">
  <div class="modal">
    <h3>Rename Macro</h3>
    <input type="text" id="renameInput" placeholder="New name" autocomplete="off">
    <div class="modal-btns">
      <button class="btn btn-dark" onclick="closeRename()">Cancel</button>
      <button class="btn btn-blue" onclick="submitRename()">Rename</button>
    </div>
  </div>
</div>

<script>
(function() {
  var state = {};
  var macros = [];
  var renameId = null;
  var es = null;
  var ABXY = ['A', 'B', 'X', 'Y'];

  function connect() {
    es = new EventSource('/events');

    es.onopen = function() {
      setStatusDot('piDot', 'green');
    };

    es.onerror = function() {
      setStatusDot('piDot', 'red');
      setStatusDot('ctrlDot', 'red');
      setStatusDot('switchDot', 'red');
    };

    es.onmessage = function(e) {
      try {
        var msg = JSON.parse(e.data);
        if (msg.type === 'init') {
          state = msg.state;
          macros = msg.macros || [];
          updateUI();
          renderMacros();
        } else if (msg.type === 'state_update') {
          state = msg.state;
          updateUI();
        } else if (msg.type === 'macro_list') {
          macros = msg.macros || [];
          renderMacros();
          updateSlotName();
        }
      } catch(err) {}
    };
  }

  connect();

  function setStatusDot(id, color) {
    var dot = document.getElementById(id);
    dot.className = 'status-dot ' + color;
  }

  function updateUI() {
    // Update hardware status dots
    setStatusDot('ctrlDot', state.usb_connected ? 'green' : 'yellow');
    setStatusDot('switchDot', state.bt_connected ? 'green' : 'red');
    var modeEl = document.getElementById('macroModeStatus');
    if (state.macro_mode) {
      modeEl.textContent = 'ON';
      modeEl.className = 'toggle-status on';
    } else {
      modeEl.textContent = 'OFF';
      modeEl.className = 'toggle-status off';
    }

    document.getElementById('slotNum').textContent = state.slot_count > 0
      ? (state.current_slot + 1) + ' / ' + state.slot_count
      : '0 / 0';
    updateSlotName();

    var recBtn = document.getElementById('btnRecord');
    var recStatus = document.getElementById('recStatus');
    if (state.recording) {
      recBtn.textContent = 'Stop Recording';
      recBtn.className = 'btn btn-yellow';
      recStatus.style.display = '';
      recStatus.className = 'rec-status active';
    } else {
      recBtn.textContent = 'Start Recording';
      recBtn.className = 'btn btn-accent';
      recStatus.style.display = 'none';
    }

    var playBtn = document.getElementById('btnPlay');
    if (state.playing) {
      playBtn.textContent = 'Playing...';
      playBtn.disabled = true;
    } else {
      playBtn.textContent = 'Play';
      playBtn.disabled = false;
    }

    var loopBtn = document.getElementById('btnLoop');
    if (state.looping) {
      loopBtn.textContent = 'Loop: ON';
      loopBtn.className = 'btn btn-blue';
    } else {
      loopBtn.textContent = 'Loop: OFF';
      loopBtn.className = 'btn btn-dark';
    }

    var speedBtns = document.getElementById('speedRow').children;
    var speeds = [0.25, 0.5, 1, 2, 4];
    for (var i = 0; i < speedBtns.length; i++) {
      speedBtns[i].className = state.playback_speed === speeds[i]
        ? 'btn btn-dark active' : 'btn btn-dark';
    }

    // Playback visualization
    var vizEl = document.getElementById('vizSection');
    if (state.playing && state.playback_input) {
      vizEl.classList.add('show');
      var pct = state.playback_frame_count > 0
        ? (state.playback_frame / state.playback_frame_count * 100) : 0;
      document.getElementById('vizProgress').style.width = pct + '%';
      document.getElementById('vizProgressLabel').textContent =
        state.playback_frame + ' / ' + state.playback_frame_count;

      var ls = state.playback_input.left_stick;
      var rs = state.playback_input.right_stick;
      var leftDot = document.getElementById('vizLeftDot');
      var rightDot = document.getElementById('vizRightDot');
      leftDot.style.left = ((ls[0] + 1) * 50) + '%';
      leftDot.style.top = ((-ls[1] + 1) * 50) + '%';
      leftDot.className = 'stick-dot' + (Math.abs(ls[0]) > 0.05 || Math.abs(ls[1]) > 0.05 ? ' active' : '');
      rightDot.style.left = ((rs[0] + 1) * 50) + '%';
      rightDot.style.top = ((-rs[1] + 1) * 50) + '%';
      rightDot.className = 'stick-dot' + (Math.abs(rs[0]) > 0.05 || Math.abs(rs[1]) > 0.05 ? ' active' : '');

      var btns = state.playback_input.buttons;
      var html = '';
      for (var j = 0; j < btns.length; j++) {
        var attr = ABXY.indexOf(btns[j]) >= 0 ? ' data-btn="' + btns[j] + '"' : '';
        html += '<span class="btn-pill"' + attr + '>' + btns[j] + '</span>';
      }
      document.getElementById('vizButtons').innerHTML = html;
    } else {
      vizEl.classList.remove('show');
    }
  }

  window.setSpeed = function(speed) {
    sendCmd('SET_PLAYBACK_SPEED', speed);
  }

  function updateSlotName() {
    var nameEl = document.getElementById('slotName');
    if (state.current_macro_name) {
      nameEl.textContent = state.current_macro_name;
    } else if (macros.length > 0 && state.current_slot < macros.length) {
      nameEl.textContent = macros[state.current_slot].name;
    } else {
      nameEl.textContent = '--';
    }
  }

  function renderMacros() {
    var container = document.getElementById('macroList');
    if (!macros || macros.length === 0) {
      container.innerHTML = '<div class="empty-msg">No macros yet</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < macros.length; i++) {
      var m = macros[i];
      var dur = m.duration_ms >= 1000
        ? (m.duration_ms / 1000).toFixed(1) + 's'
        : m.duration_ms + 'ms';
      html += '<div class="macro-item">'
        + '<div class="macro-info">'
        + '<div class="macro-name">' + escHtml(m.name) + '</div>'
        + '<div class="macro-meta">Slot ' + (i + 1) + ' &middot; ' + m.frame_count + ' frames &middot; ' + dur + '</div>'
        + '</div>'
        + '<div class="macro-actions">'
        + '<button class="btn btn-dark" onclick="selectSlot(' + i + ')">Sel</button>'
        + '<button class="btn btn-dark" onclick="openRename(' + m.id + ',\'' + escAttr(m.name) + '\')">Ren</button>'
        + '<button class="btn btn-red" onclick="deleteMacro(' + m.id + ',\'' + escAttr(m.name) + '\')">Del</button>'
        + '</div></div>';
    }
    container.innerHTML = html;
  }

  function escHtml(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }
  function escAttr(s) {
    return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  window.sendCmd = function(cmd, data) {
    fetch('/api/cmd', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd: cmd, data: data || null })
    });
  };

  window.selectSlot = function(idx) {
    fetch('/api/cmd', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd: 'SELECT_SLOT', data: idx })
    });
  };

  window.openRename = function(id, name) {
    renameId = id;
    document.getElementById('renameInput').value = name;
    document.getElementById('renameModal').classList.add('show');
    setTimeout(function() { document.getElementById('renameInput').focus(); }, 100);
  };

  window.closeRename = function() {
    document.getElementById('renameModal').classList.remove('show');
    renameId = null;
  };

  window.submitRename = function() {
    var name = document.getElementById('renameInput').value.trim();
    if (name && renameId !== null) {
      window.sendCmd('RENAME_MACRO', [renameId, name]);
    }
    closeRename();
  };

  window.deleteMacro = function(id, name) {
    if (confirm('Delete macro "' + name + '"?')) {
      window.sendCmd('DELETE_MACRO', id);
    }
  };

  document.getElementById('renameInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') window.submitRename();
    if (e.key === 'Escape') window.closeRename();
  });

  document.getElementById('renameModal').addEventListener('click', function(e) {
    if (e.target === this) window.closeRename();
  });
})();
</script>
</body>
</html>
