<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nintendo Pi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #2d2d2d; --surface: #3a3a3a; --card: #444;
    --accent: #e60012; --accent-hover: #c7000f;
    --text: #f0f0f0; --muted: #999;
    --green: #49b84f; --red: #e60012; --yellow: #f5c518; --blue: #4a9bd9;
    --joycon-blue: #00c3e3; --joycon-red: #ff3c28;
    --rail-width: 4px;
    --radius: 16px; --radius-sm: 12px;
  }
  html { font-size: 16px; }
  body {
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
    padding: 0 var(--rail-width) 2rem;
    padding: 0 var(--rail-width) calc(2rem + env(safe-area-inset-bottom, 0px));
    -webkit-tap-highlight-color: transparent;
  }
  .content-wrap {
    max-width: 900px; margin: 0 auto;
  }
  /* Subtle diamond crosshatch pattern nod to SNES controller grip */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; opacity: 0.025;
    background-image:
      linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%),
      linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
  }
  /* Joy-Con rail accents — neon blue left, neon red right */
  body::after {
    content: ''; position: fixed; inset: 0; z-index: 50; pointer-events: none;
    border-left: var(--rail-width) solid var(--joycon-blue);
    border-right: var(--rail-width) solid var(--joycon-red);
  }
  .status-bar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.7rem 1rem; background: linear-gradient(180deg, #282828 0%, #1e1e1e 100%);
    border-bottom: 3px solid transparent;
    border-image: linear-gradient(to right, var(--joycon-blue), var(--accent) 50%, var(--joycon-red)) 1;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .status-bar h1 {
    font-size: 1.05rem; font-weight: 800; letter-spacing: 0.03em;
    color: var(--text);
  }
  .status-pills { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
  .status-pill {
    display: flex; align-items: center; gap: 0.3rem;
    font-size: 0.7rem; font-weight: 700; color: var(--muted); padding: 0.2rem 0.55rem;
    background: rgba(255,255,255,0.07); border-radius: 20px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block; transition: background 0.3s, box-shadow 0.3s;
  }
  .status-dot.green { background: var(--green); box-shadow: 0 0 8px rgba(73,184,79,0.6); }
  .status-dot.red { background: var(--red); }
  .status-dot.yellow { background: var(--yellow); box-shadow: 0 0 8px rgba(245,197,24,0.5); }
  .section {
    margin: 0.6rem 0.75rem; padding: 1rem;
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.06);
    border-left: 2px solid rgba(0,195,227,0.2);
    border-right: 2px solid rgba(255,60,40,0.2);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .section-title {
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); margin-bottom: 0.7rem; font-weight: 800;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .section-title::before {
    content: ''; display: inline-block; width: 3px; height: 0.9em;
    background: var(--accent); border-radius: 2px;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: var(--radius-sm); cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem; font-weight: 700; color: #fff;
    padding: 0.7rem 1.2rem; min-height: 46px;
    transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    -webkit-user-select: none; user-select: none;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
    position: relative;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0,0,0,0.25); }
  .btn:disabled { opacity: 0.35; pointer-events: none; }
  .btn-accent { background: var(--accent); }
  .btn-green { background: var(--green); }
  .btn-blue { background: var(--blue); }
  .btn-yellow { background: var(--yellow); color: #222; }
  .btn-dark { background: rgba(255,255,255,0.1); box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  .btn-red { background: var(--red); }
  .toggle-row { display: flex; align-items: center; gap: 1rem; }
  .toggle-row .label { flex: 1; font-size: 1.05rem; font-weight: 700; }
  .toggle-status {
    font-size: 0.8rem; padding: 0.3rem 0.9rem; border-radius: 20px; font-weight: 800;
    letter-spacing: 0.03em;
  }
  .toggle-status.on { background: var(--green); color: #fff; }
  .toggle-status.off { background: rgba(255,255,255,0.1); color: var(--muted); }
  /* Home-button style toggle */
  .btn-home {
    width: 52px; height: 52px; border-radius: 50%; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: #333; border: 2px solid rgba(255,255,255,0.1);
    box-shadow: 0 3px 0 rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.06);
    min-height: unset;
  }
  .btn-home:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0,0,0,0.3); }
  .slot-nav {
    display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem;
  }
  .slot-nav .btn { flex: 0 0 auto; padding: 0.8rem; font-size: 1.3rem; border-radius: 50%; width: 46px; height: 46px; }
  /* D-pad style nav buttons */
  .dpad-btn {
    width: 50px; height: 50px; border-radius: 4px; font-size: 1.1rem;
    background: #333; border: 2px solid rgba(255,255,255,0.08);
    box-shadow: 0 3px 0 rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    position: relative;
  }
  .dpad-btn::after {
    content: ''; position: absolute; inset: 6px; border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .dpad-btn:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0,0,0,0.35); }
  .slot-info { flex: 1; text-align: center; min-width: 0; }
  .slot-num { font-size: 1.6rem; font-weight: 900; letter-spacing: -0.02em; }
  .slot-name {
    font-size: 0.85rem; color: var(--muted); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Power LED indicator */
  .power-led {
    width: 6px; height: 6px; border-radius: 50%; display: inline-block;
    background: var(--green); box-shadow: 0 0 6px rgba(73,184,79,0.7);
    margin-right: 0.5rem; vertical-align: middle;
    animation: led-breathe 3s ease-in-out infinite;
  }
  @keyframes led-breathe {
    0%, 100% { opacity: 0.7; box-shadow: 0 0 4px rgba(73,184,79,0.5); }
    50% { opacity: 1; box-shadow: 0 0 10px rgba(73,184,79,0.9); }
  }
  .speed-row { display: flex; gap: 0.4rem; margin-top: 0.6rem; }
  .speed-row .btn {
    flex: 1; padding: 0.5rem 0.3rem; font-size: 0.78rem; min-height: 38px;
    border-radius: 20px; font-weight: 800;
  }
  .speed-row .btn.active { background: var(--blue); box-shadow: 0 3px 0 rgba(0,0,0,0.25); }
  /* Face-button style circular action buttons */
  .btn-face {
    width: 62px; height: 62px; border-radius: 50%; padding: 0;
    font-size: 0.85rem; font-weight: 900; letter-spacing: 0.04em;
    border: 2.5px solid rgba(255,255,255,0.12);
    box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 0 0 3px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.15);
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    min-height: unset;
  }
  .btn-face:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 rgba(0,0,0,0.3), 0 0 0 3px rgba(0,0,0,0.15), inset 0 2px 3px rgba(0,0,0,0.3);
  }
  .playback-controls {
    display: flex; align-items: center; justify-content: center;
    gap: 0.8rem; margin-bottom: 0.6rem; padding: 0.4rem 0;
  }
  .playback-controls .btn-face { flex: 0 0 auto; }
  /* Plus/Minus shaped speed buttons */
  .speed-row .btn.pm-btn {
    position: relative; min-width: 42px;
  }
  .rec-status {
    display: inline-block; padding: 0.25rem 0.6rem; border-radius: 20px;
    font-size: 0.75rem; font-weight: 800; margin-left: 0.5rem;
    letter-spacing: 0.08em;
  }
  .rec-status.active { background: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  /* viz-section show/hide handled by max-height transition below */
  .progress-bar-outer {
    width: 100%; height: 6px; background: rgba(255,255,255,0.08);
    border-radius: 3px; overflow: hidden; margin-bottom: 0.3rem;
  }
  .progress-bar-inner {
    height: 100%; border-radius: 3px;
    background: linear-gradient(to right, var(--joycon-blue), var(--accent), var(--joycon-red));
    transition: width 0.15s linear; width: 0%;
  }
  .progress-label { font-size: 0.7rem; color: var(--muted); font-weight: 700; text-align: center; margin-bottom: 0.6rem; }
  .sticks-row { display: flex; gap: 1.5rem; justify-content: center; margin-bottom: 0.6rem; }
  .stick-container { text-align: center; }
  .stick-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.25rem; font-weight: 800; letter-spacing: 0.05em; }
  .stick-circle {
    width: 84px; height: 84px; border-radius: 50%; position: relative;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 70%);
    border: 2px solid rgba(255,255,255,0.12);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
  }
  .stick-container:first-child .stick-circle {
    border-color: rgba(0,195,227,0.25);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.3), 0 0 8px rgba(0,195,227,0.1);
  }
  .stick-container:last-child .stick-circle {
    border-color: rgba(255,60,40,0.25);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.3), 0 0 8px rgba(255,60,40,0.1);
  }
  .stick-dot {
    width: 14px; height: 14px; border-radius: 50%; background: var(--muted);
    position: absolute; transform: translate(-50%, -50%);
    transition: left 0.1s linear, top 0.1s linear, background 0.1s;
    left: 50%; top: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .stick-dot.active { background: var(--green); box-shadow: 0 0 8px rgba(73,184,79,0.5); }
  .btn-pills {
    display: flex; flex-wrap: wrap; gap: 0.3rem; justify-content: center;
    min-height: 1.6rem;
  }
  .btn-pill {
    display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px;
    font-size: 0.72rem; font-weight: 800; color: #fff;
    background: var(--accent); letter-spacing: 0.02em;
    box-shadow: 0 2px 0 rgba(0,0,0,0.2);
  }
  /* Color specific button pills like ABXY face buttons */
  .btn-pill[data-btn="A"] { background: var(--green); }
  .btn-pill[data-btn="B"] { background: var(--red); }
  .btn-pill[data-btn="X"] { background: var(--blue); }
  .btn-pill[data-btn="Y"] { background: var(--yellow); color: #222; }
  .macro-list-grid { display: grid; grid-template-columns: 1fr; gap: 0; }
  .macro-item {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.7rem 0; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .macro-item:last-child { border-bottom: none; }
  .macro-info { flex: 1; min-width: 0; }
  .macro-name {
    font-weight: 700; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .macro-meta { font-size: 0.75rem; color: var(--muted); font-weight: 600; }
  .macro-actions { display: flex; gap: 0.3rem; }
  .macro-actions .btn { padding: 0.4rem 0.6rem; font-size: 0.78rem; min-height: 36px; border-radius: 10px; }
  .empty-msg { color: var(--muted); font-size: 0.9rem; font-weight: 600; text-align: center; padding: 1rem; }
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7); align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface); border-radius: var(--radius);
    padding: 1.5rem; width: 90%; max-width: 340px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .modal h3 { margin-bottom: 1rem; font-size: 1.1rem; font-weight: 800; }
  .modal input {
    width: 100%; padding: 0.7rem; border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,0.15); background: var(--bg);
    color: var(--text); font-size: 1rem; font-family: 'Nunito', sans-serif;
    font-weight: 600; margin-bottom: 1rem;
  }
  .modal input:focus { outline: none; border-color: var(--accent); }
  .modal-btns { display: flex; gap: 0.5rem; }
  .modal-btns .btn { flex: 1; }

  /* === Switch-style entrance animations === */
  @keyframes section-in {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .section, .status-bar {
    animation: section-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .status-bar { animation-delay: 0s; }
  .grid-area .section:nth-child(1) { animation-delay: 0.04s; }
  .grid-area .section:nth-child(2) { animation-delay: 0.08s; }
  .grid-area .section:nth-child(3) { animation-delay: 0.12s; }
  .grid-area .section:nth-child(4) { animation-delay: 0.16s; }
  .grid-area .section:nth-child(5) { animation-delay: 0.20s; }

  /* === Smooth viz section slide === */
  .viz-section {
    max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.3s ease,
                margin 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                padding 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    margin: 0 0.75rem; padding-top: 0; padding-bottom: 0;
    display: block;
  }
  .viz-section.show {
    max-height: 400px; opacity: 1;
    margin: 0.6rem 0.75rem; padding: 1rem;
  }

  /* === Slot number pop on change === */
  @keyframes slot-pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .slot-num.pop { animation: slot-pop 0.25s cubic-bezier(0.22, 1, 0.36, 1); }

  /* === Switch-style slide toggle for macro mode === */
  .switch-toggle {
    width: 58px; height: 30px; border-radius: 15px; padding: 2px;
    background: rgba(255,255,255,0.12); border: none; cursor: pointer;
    position: relative; transition: background 0.25s ease;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
    -webkit-tap-highlight-color: transparent;
  }
  .switch-toggle.on { background: var(--green); }
  .switch-toggle .knob {
    width: 26px; height: 26px; border-radius: 50%;
    background: #fff; display: block;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .switch-toggle.on .knob { transform: translateX(28px); }

  /* === Recording glow ring === */
  @keyframes rec-ring {
    0%, 100% { box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 0 0 3px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.15), 0 0 0 0 rgba(230,0,18,0); }
    50% { box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 0 0 3px rgba(0,0,0,0.15), inset 0 1px 1px rgba(255,255,255,0.15), 0 0 0 10px rgba(230,0,18,0.25); }
  }
  .btn-face.recording {
    animation: rec-ring 1.2s ease-in-out infinite;
  }

  /* === Button press feedback === */
  .btn-face { transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.12s ease, background 0.2s ease, opacity 0.2s ease; }
  .dpad-btn { transition: transform 0.12s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.12s ease; }

  /* === Slot name fade === */
  .slot-name { transition: opacity 0.2s ease; }
  .slot-name.fading { opacity: 0; }

  /* === Responsive grid layout === */
  .grid-area {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
  }

  /* Tablet: 2-column grid for main controls, library spans full width */
  @media (min-width: 600px) {
    .content-wrap { padding: 0 0.5rem; }
    .grid-area {
      grid-template-columns: 1fr 1fr;
      gap: 0 0.25rem;
    }
    .grid-area .section { margin: 0.6rem 0.5rem; }
    .grid-span-full { grid-column: 1 / -1; }
    .status-bar { border-radius: 0 0 var(--radius) var(--radius); }
    .section { transition: box-shadow 0.2s ease, border-color 0.2s ease; }
    .section:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      border-color: rgba(255,255,255,0.1);
    }
  }

  /* Desktop: wider spacing, capped width */
  @media (min-width: 900px) {
    .content-wrap { padding: 0 1rem; }
    .grid-area .section { margin: 0.75rem 0.5rem; padding: 1.25rem; }
    .status-bar { margin: 0 0.5rem; }
    .stick-circle { width: 100px; height: 100px; }
    .macro-list-grid { grid-template-columns: 1fr 1fr; gap: 0 1.5rem; }
    .macro-item { padding: 0.8rem 0; }
  }
</style>
</head>
<body>

<div class="content-wrap">

<div class="status-bar">
  <h1><span class="power-led"></span>Nintendo Pi</h1>
  <div class="status-pills">
    <div class="status-pill"><span class="status-dot red" id="piDot"></span><span id="piLabel">Pi</span></div>
    <div class="status-pill"><span class="status-dot red" id="ctrlDot"></span><span id="ctrlLabel">Controller</span></div>
    <div class="status-pill"><span class="status-dot red" id="switchDot"></span><span id="switchLabel">Switch</span></div>
  </div>
</div>

<div class="grid-area">

<div class="section">
  <div class="section-title">Macro Mode</div>
  <div class="toggle-row">
    <span class="label">Macro Mode</span>
    <span class="toggle-status off" id="macroModeStatus">OFF</span>
    <button class="switch-toggle" id="btnMacroMode" onclick="sendCmd('TOGGLE_MACRO_MODE')">
      <span class="knob"></span>
    </button>
  </div>
</div>

<div class="section">
  <div class="section-title">Recording</div>
  <div style="display:flex;align-items:center;justify-content:center;gap:0.8rem">
    <button class="btn btn-accent btn-face" id="btnRecord" onclick="sendCmd('TOGGLE_RECORDING')" style="width:68px;height:68px;font-size:0.75rem">
      REC
    </button>
    <span class="rec-status" id="recStatus" style="display:none">REC</span>
  </div>
</div>

<div class="section grid-span-full">
  <div class="section-title">Slot &amp; Playback</div>
  <div class="slot-nav">
    <button class="btn dpad-btn" onclick="sendCmd('PREV_SLOT')">&larr;</button>
    <div class="slot-info">
      <div class="slot-num" id="slotNum">0</div>
      <div class="slot-name" id="slotName">--</div>
    </div>
    <button class="btn dpad-btn" onclick="sendCmd('NEXT_SLOT')">&rarr;</button>
  </div>
  <div class="playback-controls">
    <button class="btn btn-green btn-face" id="btnPlay" onclick="sendCmd('PLAY_MACRO')">PLAY</button>
    <button class="btn btn-red btn-face" id="btnStop" onclick="sendCmd('STOP_PLAYBACK')">STOP</button>
    <button class="btn btn-dark btn-face" id="btnLoop" onclick="sendCmd('TOGGLE_LOOP')" style="font-size:0.7rem">LOOP<br>OFF</button>
  </div>
  <div class="speed-row" id="speedRow">
    <button class="btn btn-dark" onclick="setSpeed(0.25)">0.25x</button>
    <button class="btn btn-dark" onclick="setSpeed(0.5)">0.5x</button>
    <button class="btn btn-dark active" onclick="setSpeed(1)">1x</button>
    <button class="btn btn-dark" onclick="setSpeed(2)">2x</button>
    <button class="btn btn-dark" onclick="setSpeed(4)">4x</button>
  </div>
</div>

<div class="section viz-section grid-span-full" id="vizSection">
  <div class="section-title">Playback</div>
  <div class="progress-bar-outer"><div class="progress-bar-inner" id="vizProgress"></div></div>
  <div class="progress-label" id="vizProgressLabel">0 / 0</div>
  <div class="sticks-row">
    <div class="stick-container">
      <div class="stick-label">L</div>
      <div class="stick-circle"><div class="stick-dot" id="vizLeftDot"></div></div>
    </div>
    <div class="stick-container">
      <div class="stick-label">R</div>
      <div class="stick-circle"><div class="stick-dot" id="vizRightDot"></div></div>
    </div>
  </div>
  <div class="btn-pills" id="vizButtons"></div>
</div>

<div class="section grid-span-full">
  <div class="section-title">Macro Library</div>
  <div id="macroList"><div class="empty-msg">No macros yet</div></div>
</div>

</div><!-- grid-area -->
</div><!-- content-wrap -->

<div class="modal-overlay" id="renameModal">
  <div class="modal">
    <h3>Rename Macro</h3>
    <input type="text" id="renameInput" placeholder="New name" autocomplete="off">
    <div class="modal-btns">
      <button class="btn btn-dark" onclick="closeRename()">Cancel</button>
      <button class="btn btn-blue" onclick="submitRename()">Rename</button>
    </div>
  </div>
</div>

<script>
(function() {
  var state = {};
  var macros = [];
  var renameId = null;
  var es = null;
  var ABXY = ['A', 'B', 'X', 'Y'];

  // === Nintendo-style synthesized UI sound effects ===
  var audioCtx = null;
  var sfxEnabled = true;
  var sfxUnlocked = false;

  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // Unlock audio on first user interaction (required by mobile browsers)
  function unlockAudio() {
    if (sfxUnlocked) return;
    sfxUnlocked = true;
    var ctx = getAudioCtx();
    var b = ctx.createBuffer(1, 1, ctx.sampleRate);
    var s = ctx.createBufferSource();
    s.buffer = b;
    s.connect(ctx.destination);
    s.start(0);
  }
  document.addEventListener('touchstart', unlockAudio, { once: true });
  document.addEventListener('click', unlockAudio, { once: true });

  // Play a tone: frequency (Hz), duration (s), volume (0-1), type, optional ramp
  function playTone(freq, dur, vol, type, rampTo) {
    if (!sfxEnabled) return;
    var ctx = getAudioCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    if (rampTo) {
      osc.frequency.exponentialRampToValueAtTime(rampTo, ctx.currentTime + dur);
    }
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + dur);
  }

  // Play a quick noise click (like a soft mechanical tick)
  function playClick(vol) {
    if (!sfxEnabled) return;
    var ctx = getAudioCtx();
    var bufferSize = Math.floor(ctx.sampleRate * 0.012);
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufferSize; i++) {
      // Shaped noise burst — sharp attack, fast decay
      var env = Math.exp(-i / (bufferSize * 0.15));
      data[i] = (Math.random() * 2 - 1) * env;
    }
    var src = ctx.createBufferSource();
    var gain = ctx.createGain();
    src.buffer = buffer;
    gain.gain.setValueAtTime(vol || 0.15, ctx.currentTime);
    src.connect(gain);
    gain.connect(ctx.destination);
    src.start(ctx.currentTime);
  }

  // Sound library — short, musical, Switch-OS-inspired
  var sfx = {
    // Navigation tick — soft high pop
    nav: function() {
      playClick(0.12);
      playTone(1800, 0.04, 0.08, 'sine');
    },
    // Confirmation — two-note rising chime
    confirm: function() {
      playTone(880, 0.08, 0.1, 'sine');
      setTimeout(function() { playTone(1320, 0.1, 0.1, 'sine'); }, 60);
    },
    // Toggle ON — bright rising sweep
    toggleOn: function() {
      playTone(660, 0.12, 0.1, 'sine', 1200);
    },
    // Toggle OFF — descending soft tone
    toggleOff: function() {
      playTone(880, 0.12, 0.08, 'sine', 440);
    },
    // Record start — two quick ascending pips
    recStart: function() {
      playTone(740, 0.06, 0.1, 'square');
      setTimeout(function() { playTone(988, 0.08, 0.1, 'square'); }, 70);
    },
    // Record stop — single descending tone
    recStop: function() {
      playTone(988, 0.1, 0.1, 'square', 520);
    },
    // Play macro — cheerful three-note ascending
    play: function() {
      playTone(660, 0.07, 0.09, 'sine');
      setTimeout(function() { playTone(880, 0.07, 0.09, 'sine'); }, 60);
      setTimeout(function() { playTone(1100, 0.1, 0.09, 'sine'); }, 120);
    },
    // Stop — soft thud
    stop: function() {
      playTone(220, 0.1, 0.12, 'sine', 110);
      playClick(0.1);
    },
    // Slot change — crisp tick
    slot: function() {
      playClick(0.15);
      playTone(1400, 0.035, 0.07, 'triangle');
    },
    // Delete — low warning
    del: function() {
      playTone(330, 0.08, 0.1, 'sawtooth', 220);
      setTimeout(function() { playTone(220, 0.12, 0.08, 'sawtooth', 165); }, 80);
    },
    // Generic button press
    press: function() {
      playClick(0.1);
    }
  };

  function connect() {
    es = new EventSource('/events');

    es.onopen = function() {
      setStatusDot('piDot', 'green');
    };

    es.onerror = function() {
      setStatusDot('piDot', 'red');
      setStatusDot('ctrlDot', 'red');
      setStatusDot('switchDot', 'red');
    };

    es.onmessage = function(e) {
      try {
        var msg = JSON.parse(e.data);
        if (msg.type === 'init') {
          state = msg.state;
          macros = msg.macros || [];
          updateUI();
          renderMacros();
        } else if (msg.type === 'state_update') {
          state = msg.state;
          updateUI();
        } else if (msg.type === 'macro_list') {
          macros = msg.macros || [];
          renderMacros();
          updateSlotName();
        }
      } catch(err) {}
    };
  }

  connect();

  function setStatusDot(id, color) {
    var dot = document.getElementById(id);
    dot.className = 'status-dot ' + color;
  }

  function updateUI() {
    // Update hardware status dots
    setStatusDot('ctrlDot', state.usb_connected ? 'green' : 'yellow');
    setStatusDot('switchDot', state.bt_connected ? 'green' : 'red');
    var modeEl = document.getElementById('macroModeStatus');
    var toggleBtn = document.getElementById('btnMacroMode');
    if (state.macro_mode) {
      modeEl.textContent = 'ON';
      modeEl.className = 'toggle-status on';
      toggleBtn.classList.add('on');
    } else {
      modeEl.textContent = 'OFF';
      modeEl.className = 'toggle-status off';
      toggleBtn.classList.remove('on');
    }

    var slotEl = document.getElementById('slotNum');
    var newSlotText = state.slot_count > 0
      ? (state.current_slot + 1) + ' / ' + state.slot_count
      : '0 / 0';
    if (slotEl.textContent !== newSlotText) {
      slotEl.textContent = newSlotText;
      slotEl.classList.remove('pop');
      void slotEl.offsetWidth; // reflow to restart animation
      slotEl.classList.add('pop');
    }
    updateSlotName();

    var recBtn = document.getElementById('btnRecord');
    var recStatus = document.getElementById('recStatus');
    if (state.recording) {
      recBtn.textContent = 'STOP';
      recBtn.className = 'btn btn-yellow btn-face recording';
      recBtn.style.width = '68px'; recBtn.style.height = '68px'; recBtn.style.fontSize = '0.75rem';
      recStatus.style.display = '';
      recStatus.className = 'rec-status active';
    } else {
      recBtn.textContent = 'REC';
      recBtn.className = 'btn btn-accent btn-face';
      recBtn.style.width = '68px'; recBtn.style.height = '68px'; recBtn.style.fontSize = '0.75rem';
      recStatus.style.display = 'none';
    }

    var playBtn = document.getElementById('btnPlay');
    if (state.playing) {
      playBtn.innerHTML = '&#9654;';
      playBtn.disabled = true;
      playBtn.style.opacity = '0.5';
    } else {
      playBtn.textContent = 'PLAY';
      playBtn.disabled = false;
      playBtn.style.opacity = '';
    }

    var loopBtn = document.getElementById('btnLoop');
    if (state.looping) {
      loopBtn.innerHTML = 'LOOP<br>ON';
      loopBtn.className = 'btn btn-blue btn-face';
      loopBtn.style.fontSize = '0.7rem';
    } else {
      loopBtn.innerHTML = 'LOOP<br>OFF';
      loopBtn.className = 'btn btn-dark btn-face';
      loopBtn.style.fontSize = '0.7rem';
    }

    var speedBtns = document.getElementById('speedRow').children;
    var speeds = [0.25, 0.5, 1, 2, 4];
    for (var i = 0; i < speedBtns.length; i++) {
      speedBtns[i].className = state.playback_speed === speeds[i]
        ? 'btn btn-dark active' : 'btn btn-dark';
    }

    // Playback visualization
    var vizEl = document.getElementById('vizSection');
    if (state.playing && state.playback_input) {
      vizEl.classList.add('show');
      var pct = state.playback_frame_count > 0
        ? (state.playback_frame / state.playback_frame_count * 100) : 0;
      document.getElementById('vizProgress').style.width = pct + '%';
      document.getElementById('vizProgressLabel').textContent =
        state.playback_frame + ' / ' + state.playback_frame_count;

      var ls = state.playback_input.left_stick;
      var rs = state.playback_input.right_stick;
      var leftDot = document.getElementById('vizLeftDot');
      var rightDot = document.getElementById('vizRightDot');
      leftDot.style.left = ((ls[0] + 1) * 50) + '%';
      leftDot.style.top = ((-ls[1] + 1) * 50) + '%';
      leftDot.className = 'stick-dot' + (Math.abs(ls[0]) > 0.05 || Math.abs(ls[1]) > 0.05 ? ' active' : '');
      rightDot.style.left = ((rs[0] + 1) * 50) + '%';
      rightDot.style.top = ((-rs[1] + 1) * 50) + '%';
      rightDot.className = 'stick-dot' + (Math.abs(rs[0]) > 0.05 || Math.abs(rs[1]) > 0.05 ? ' active' : '');

      var btns = state.playback_input.buttons;
      var html = '';
      for (var j = 0; j < btns.length; j++) {
        var attr = ABXY.indexOf(btns[j]) >= 0 ? ' data-btn="' + btns[j] + '"' : '';
        html += '<span class="btn-pill"' + attr + '>' + btns[j] + '</span>';
      }
      document.getElementById('vizButtons').innerHTML = html;
    } else {
      vizEl.classList.remove('show');
    }
  }

  window.setSpeed = function(speed) {
    sfx.nav();
    sendCmd('SET_PLAYBACK_SPEED', speed);
  }

  function updateSlotName() {
    var nameEl = document.getElementById('slotName');
    var newName;
    if (state.current_macro_name) {
      newName = state.current_macro_name;
    } else if (macros.length > 0 && state.current_slot < macros.length) {
      newName = macros[state.current_slot].name;
    } else {
      newName = '--';
    }
    if (nameEl.textContent !== newName) {
      nameEl.classList.add('fading');
      setTimeout(function() {
        nameEl.textContent = newName;
        nameEl.classList.remove('fading');
      }, 150);
    }
  }

  function renderMacros() {
    var container = document.getElementById('macroList');
    if (!macros || macros.length === 0) {
      container.innerHTML = '<div class="empty-msg">No macros yet</div>';
      return;
    }
    var html = '<div class="macro-list-grid">';
    for (var i = 0; i < macros.length; i++) {
      var m = macros[i];
      var dur = m.duration_ms >= 1000
        ? (m.duration_ms / 1000).toFixed(1) + 's'
        : m.duration_ms + 'ms';
      html += '<div class="macro-item">'
        + '<div class="macro-info">'
        + '<div class="macro-name">' + escHtml(m.name) + '</div>'
        + '<div class="macro-meta">Slot ' + (i + 1) + ' &middot; ' + m.frame_count + ' frames &middot; ' + dur + '</div>'
        + '</div>'
        + '<div class="macro-actions">'
        + '<button class="btn btn-dark" onclick="selectSlot(' + i + ')">Sel</button>'
        + '<button class="btn btn-dark" onclick="openRename(' + m.id + ',\'' + escAttr(m.name) + '\')">Ren</button>'
        + '<button class="btn btn-red" onclick="deleteMacro(' + m.id + ',\'' + escAttr(m.name) + '\')">Del</button>'
        + '</div></div>';
    }
    html += '</div>';
    container.innerHTML = html;
  }

  function escHtml(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }
  function escAttr(s) {
    return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  window.sendCmd = function(cmd, data) {
    // Play appropriate sound effect per command
    switch (cmd) {
      case 'TOGGLE_MACRO_MODE':
        (state.macro_mode ? sfx.toggleOff : sfx.toggleOn)(); break;
      case 'TOGGLE_RECORDING':
        (state.recording ? sfx.recStop : sfx.recStart)(); break;
      case 'PREV_SLOT':
      case 'NEXT_SLOT':
        sfx.slot(); break;
      case 'PLAY_MACRO':
        sfx.play(); break;
      case 'STOP_PLAYBACK':
        sfx.stop(); break;
      case 'TOGGLE_LOOP':
        (state.looping ? sfx.toggleOff : sfx.toggleOn)(); break;
      case 'SET_PLAYBACK_SPEED':
        sfx.nav(); break;
      default:
        sfx.press(); break;
    }
    fetch('/api/cmd', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd: cmd, data: data || null })
    });
  };

  window.selectSlot = function(idx) {
    sfx.slot();
    fetch('/api/cmd', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd: 'SELECT_SLOT', data: idx })
    });
  };

  window.openRename = function(id, name) {
    sfx.nav();
    renameId = id;
    document.getElementById('renameInput').value = name;
    document.getElementById('renameModal').classList.add('show');
    setTimeout(function() { document.getElementById('renameInput').focus(); }, 100);
  };

  window.closeRename = function() {
    sfx.press();
    document.getElementById('renameModal').classList.remove('show');
    renameId = null;
  };

  window.submitRename = function() {
    var name = document.getElementById('renameInput').value.trim();
    if (name && renameId !== null) {
      sfx.confirm();
      window.sendCmd('RENAME_MACRO', [renameId, name]);
    }
    closeRename();
  };

  window.deleteMacro = function(id, name) {
    sfx.del();
    if (confirm('Delete macro "' + name + '"?')) {
      window.sendCmd('DELETE_MACRO', id);
    }
  };

  document.getElementById('renameInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') window.submitRename();
    if (e.key === 'Escape') window.closeRename();
  });

  document.getElementById('renameModal').addEventListener('click', function(e) {
    if (e.target === this) window.closeRename();
  });
})();
</script>
</body>
</html>
